<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#0077ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(100,100)" filter="url(#glow)">
    <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="none" stroke="url(#coreGrad)" stroke-width="4" stroke-linejoin="round" opacity="0.9"/>
    <polygon points="0,-45 40,-22 40,22 0,45 -40,22 -40,-22" fill="none" stroke="url(#coreGrad)" stroke-width="3" stroke-linejoin="round" opacity="0.6"/>
    <circle cx="0" cy="0" r="12" fill="url(#coreGrad)" opacity="0.9"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff" opacity="0.95"/>
  </g>
  <g transform="translate(100,100)" opacity="0.4">
    <line x1="0" y1="-70" x2="0" y2="-90" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>
    <line x1="60" y1="-35" x2="75" y2="-50" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>
    <line x1="60" y1="35" x2="75" y2="50" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="70" x2="0" y2="90" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>
    <line x1="-60" y1="35" x2="-75" y2="50" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>
    <line x1="-60" y1="-35" x2="-75" y2="-50" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
