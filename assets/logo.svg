<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#5500ff" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer hexagon -->
  <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="none" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linejoin="round" opacity="0.9" />

  <!-- Inner hexagon -->
  <polygon points="32,14 48,24 48,40 32,50 16,40 16,24" fill="none" stroke="url(#logoGrad)" stroke-width="1.5" stroke-linejoin="round" opacity="0.5" />

  <!-- Circuit paths -->
  <path d="M32,4 L32,14 M58,18 L48,24 M58,46 L48,40 M32,60 L32,50 M6,46 L16,40 M6,18 L16,24" stroke="url(#logoGrad)" stroke-width="1" opacity="0.6" />

  <!-- Core -->
  <circle cx="32" cy="32" r="6" fill="url(#logoGrad)" filter="url(#glow)" opacity="0.9" />
  <circle cx="32" cy="32" r="3" fill="#ffffff" opacity="0.9" />

  <!-- Orbiting dots -->
  <circle cx="32" cy="18" r="1.5" fill="#00f0ff" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="48" cy="26" r="1.2" fill="#0088ff" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" from="120 32 32" to="480 32 32" dur="12s" repeatCount="indefinite" />
  </circle>
  <circle cx="48" cy="38" r="1.2" fill="#5500ff" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" from="240 32 32" to="600 32 32" dur="10s" repeatCount="indefinite" />
  </circle>
</svg>
