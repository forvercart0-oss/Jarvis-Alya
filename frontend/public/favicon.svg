<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <g filter="url(#glow)" transform="translate(32,32) scale(1.1)">
    <polygon points="-12,-18 12,-18 22,0 12,18 -12,18 -22,0" fill="none" stroke="url(#grad)" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="0" y1="-18" x2="0" y2="18" stroke="url(#grad)" stroke-width="1.5" opacity="0.5"/>
    <line x1="-22" y1="0" x2="22" y2="0" stroke="url(#grad)" stroke-width="1.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="4" fill="#00f0ff"/>
  </g>
</svg>
