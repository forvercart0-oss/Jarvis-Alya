<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" style="stop-color:#0a1f2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#02070c;stop-opacity:1" />
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur1"/>
      <feGaussianBlur stdDeviation="30" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)" />

  <g filter="url(#glow)" transform="translate(256,256) scale(1.05)">
    <polygon points="0,-190 164,-95 164,95 0,190 -164,95 -164,-95" fill="none" stroke="url(#grad)" stroke-width="22" stroke-linejoin="round"/>
    <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75" fill="none" stroke="url(#grad)" stroke-width="12" stroke-linejoin="round" opacity="0.55"/>
    <line x1="0" y1="-190" x2="0" y2="190" stroke="url(#grad)" stroke-width="12" opacity="0.4"/>
    <line x1="-164" y1="0" x2="164" y2="0" stroke="url(#grad)" stroke-width="12" opacity="0.4"/>
    <circle cx="0" cy="0" r="34" fill="#00f0ff"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#00f0ff" stroke-width="8" opacity="0.45"/>
  </g>
</svg>
