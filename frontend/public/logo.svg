<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feGaussianBlur stdDeviation="12" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00c8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <g filter="url(#glow)">
    <polygon points="55,15 85,15 100,50 85,85 55,85 40,50" fill="none" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="55,25 80,25 92,50 80,75 55,75 45,50" fill="none" stroke="url(#iconGrad)" stroke-width="1.5" stroke-linejoin="round" opacity="0.6"/>
    <line x1="70" y1="15" x2="70" y2="85" stroke="url(#iconGrad)" stroke-width="1.5" opacity="0.4"/>
    <line x1="40" y1="50" x2="100" y2="50" stroke="url(#iconGrad)" stroke-width="1.5" opacity="0.4"/>
    <circle cx="70" cy="50" r="4" fill="#00f0ff" opacity="0.9"/>
  </g>

  <text x="120" y="72" font-family="'Segoe UI', system-ui, sans-serif" font-size="48" font-weight="700" letter-spacing="6" fill="url(#textGrad)" filter="url(#glow)">JARVIS</text>
  <text x="122" y="92" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" letter-spacing="8" fill="#0077ff" opacity="0.8">ARTIFICIAL INTELLIGENCE</text>
</svg>
